<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex font-body-md">
<!-- Left Side: Image (Hidden on Mobile) -->
<div class="hidden md:block w-1/2 h-full relative">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A serene, breathtaking view of a mist-covered lake in Kutai Barat at sunrise. The calm waters reflect the soft morning light and surrounding lush, emerald-green tropical rainforest. A traditional wooden boat rests gently on the edge, creating a sense of tranquility. High-end, editorial travel photography style with a muted, elegant color palette." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDid_gmM9UhFJ8m0QaiOs6dp390SoP5Xpw5tZxm7NUdtHGNcwPXzkWaiomWCncS2jLz8EwNfLOTHik2DoF-KHIDjlQcn0cRSsm3rKcmptgx9oH8hKCrs0gwvdMWDiC6l6HLGdgo6B21Ik6C_1WNPZm-rTbtR-sqoTzXl991NwILyc62nM5Bja8oE7chH7Qc6Gg7GXgtNa4X3o4Y5nMNDuZ6jKOzMiNAP8m-xj7l06OJuxwGvNNPmuU')"></div>
<div class="absolute inset-0 bg-black/20"></div>
<div class="absolute bottom-margin-desktop left-margin-desktop text-on-primary">
<h2 class="font-headline-md text-headline-md mb-stack-sm drop-shadow-md">Discover the Heart of Borneo</h2>
<p class="font-body-lg text-body-lg opacity-90 drop-shadow-md">Join Jelajah Kubar and start your authentic journey.</p>
</div>
</div>
<!-- Right Side: Sign Up Form -->
<div class="w-full md:w-1/2 h-full flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-lowest overflow-y-auto">
<div class="w-full max-w-[400px]">
<!-- Logo / Header -->
<div class="mb-stack-lg text-center md:text-left">
<a class="inline-block mb-stack-md font-headline-md text-headline-md text-primary tracking-tight" href="#">Jelajah Kubar</a>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-headline-md md:text-headline-md text-on-surface mb-stack-sm">Create an account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start planning your cultural adventure.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-stack-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="name">Full Name</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow" id="name" name="name" placeholder="e.g. John Doe" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="email">Email address</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="password">Password</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Password Confirmation -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="password_confirmation">Confirm Password</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow" id="password_confirmation" name="password_confirmation" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Terms -->
<div class="flex items-start pt-stack-sm pb-stack-sm">
<div class="flex h-6 items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3">
<label class="font-caption text-caption text-on-surface-variant" for="terms">
                            I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-opacity duration-200 active:scale-[0.98]" type="submit">
                    Sign Up
                </button>
</form>
<!-- Login Link -->
<div class="mt-stack-lg text-center font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Sign in here</a>
</div>
</div>
</div>
